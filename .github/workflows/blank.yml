name: 🚀 Nigger VPS

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Tempo de utilização'
        required: false
        default: '5h40m'
        type: choice
        options:
        - '1h'
        - '3h' 
        - '5h40m'

jobs:
  Premium-RDP-Setup:
    runs-on: windows-latest
    timeout-minutes: 340
    
    steps:
      # BANNER DE BOAS-VINDAS
      - name: 🎯 INICIAR SISTEMA
        run: |
          Write-Host ""
          Write-Host ""
          Write-Host "🤖 AI STV PREMIUM RDP SERVER" -ForegroundColor Yellow
          Write-Host "⚡ Powered by AI STV" -ForegroundColor Green
          Write-Host "🕒 Tempo: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta
          Write-Host ""
          
          # Efeito de loading
          $frames = @('⣾', '⣽', '⣻', '⢿', '⡿', '⣟', '⣯', '⣷')
          for($i=0; $i -lt 10; $i++) {
              Write-Host "`r🚀 A inicializar o sistema... $($frames[$i % 8])" -NoNewline -ForegroundColor Blue
              Start-Sleep -Milliseconds 100
          }
          Write-Host "`r✅ Sistema pronto!                    " -ForegroundColor Green

      # CONFIGURAÇÃO AVANÇADA
      - name: 🔧 CONFIGURAR SISTEMA
        run: |
          Write-Host ""
          Write-Host "🛠️  A CONFIGURAR O SISTEMA" -ForegroundColor Yellow
          
          $steps = @(
              @{Name="Ativar Remote Desktop"; Script={ 
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
              }},
              @{Name="Desativar autenticação de rede"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              }},
              @{Name="Configurar segurança RDP"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              }},
              @{Name="Abrir porta 3389 na firewall"; Script={
                  netsh advfirewall firewall add rule name="RDP-Premium" dir=in action=allow protocol=TCP localport=3389 profile=any
                  netsh advfirewall firewall add rule name="RDP-Premium-Out" dir=out action=allow protocol=TCP localport=3389 profile=any
              }},
              @{Name="Iniciar serviços"; Script={
                  Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
                  Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
                  Start-Service -Name UmRdpService -ErrorAction SilentlyContinue
              }}
          )
          
          foreach($step in $steps) {
              Write-Host "│ 📋 $($step.Name)..." -NoNewline -ForegroundColor White
              try {
                  & $step.Script
                  Write-Host "`r│ ✅ $($step.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "`r│ ⚠️  $($step.Name) - Pequeno erro ignorado" -ForegroundColor Yellow
              }
              Start-Sleep -Milliseconds 500
          }
          
          Write-Host "🎯 Configuração concluída!" -ForegroundColor Green

      # CRIAR UTILIZADOR PREMIUM - (otimização de palavra-passe)
      - name: 👤 CRIAR CONTA PREMIUM
        run: |
          Write-Host ""
          Write-Host "👤 A CRIAR CONTA PREMIUM" -ForegroundColor Yellow
          
          # Função para gerar palavra-passe curta (8 caracteres) garantindo pelo menos 1 maiúscula, 1 minúscula e 1 número
          function New-PremiumPassword {
              param()
              $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'   # exclui I, O para evitar confusão
              $lower = 'abcdefghijkmnpqrstuvwxyz'
              $numbers = '23456789'               # exclui 0, 1 para evitar confusão
              $all = $upper + $lower + $numbers

              # garante 1 maiúscula, 1 minúscula, 1 número
              $pw = ''
              $pw += $upper[(Get-Random -Minimum 0 -Maximum $upper.Length)]
              $pw += $lower[(Get-Random -Minimum 0 -Maximum $lower.Length)]
              $pw += $numbers[(Get-Random -Minimum 0 -Maximum $numbers.Length)]

              # adiciona carateres aleatórios para atingir 8 carateres
              for ($i = 1; $i -le 5; $i++) {
                  $pw += $all[(Get-Random -Minimum 0 -Maximum $all.Length)]
              }

              # baralha aleatoriamente a posição dos carateres e retorna
              return -join ($pw.ToCharArray() | Sort-Object { Get-Random })
          }

          # Se o utilizador definir uma palavra-passe personalizada (ex: via secret), dar prioridade
          if ($env:CUSTOM_RDP_PASS) {
              $matKhau = $env:CUSTOM_RDP_PASS
              Write-Host "│ ℹ️  A usar palavra-passe personalizada das env" -ForegroundColor Blue
          } else {
              $matKhau = New-PremiumPassword
          }

          $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force
          
          # Apagar utilizador antigo caso exista
          try {
              Remove-LocalUser -Name "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              Write-Host "│ ✅ Utilizador antigo apagado" -ForegroundColor Green
          } catch {
              Write-Host "│ ℹ️  Sem utilizador antigo para apagar" -ForegroundColor Blue
          }
          
          # Criar novo utilizador com plenos privilégios
          try {
              New-LocalUser -Name "AISTV-PREMIUM" -Password $securePass -AccountNeverExpires -Description "AI STV Premium Account"
              Write-Host "│ ✅ Novo utilizador criado" -ForegroundColor Green
              
              # Definir palavra-passe para nunca expirar (usar Set-LocalUser se necessário)
              try {
                  Set-LocalUser -Name "AISTV-PREMIUM" -PasswordNeverExpires $true -ErrorAction SilentlyContinue
              } catch {
                  # Se o ambiente não suportar Set-LocalUser, ignorar com segurança
              }

              # Adicionar aos grupos necessários
              Add-LocalGroupMember -Group "Administrators" -Member "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Users" -Member "AISTV-PREMIUM" -ErrorAction SilentlyContinue
              
              # Ativar utilizador
              Enable-LocalUser -Name "AISTV-PREMIUM"
              
              Write-Host "│ ✅ Permissões de Administrador e RDP concedidas" -ForegroundColor Green
              
          } catch {
              Write-Host "│ ❌ Erro ao criar utilizador: $($_.Exception.Message)" -ForegroundColor Red
              exit 1
          }
          
          # Guardar informação (cuidado se o repositório for público)
          echo "RDP_USER=AISTV-PREMIUM" >> $env:GITHUB_ENV
          echo "RDP_PASS=$matKhau" >> $env:GITHUB_ENV
          echo "$matKhau" > $env:TEMP\rdp_password.txt
          
          Write-Host "✅ Conta: AISTV-PREMIUM pronta a usar" -ForegroundColor Green

      # VERIFICAR PERMISSÕES DE LOGIN
      - name: 🔍 VERIFICAR PERMISSÕES DO SISTEMA
        run: |
          Write-Host ""
          Write-Host "🔍 A VERIFICAR PERMISSÕES DE LOGIN" -ForegroundColor Yellow
          
          # Verificar se o utilizador existe
          $user = Get-LocalUser -Name "AISTV-PREMIUM" -ErrorAction SilentlyContinue
          if ($user) {
              Write-Host "│ ✅ Utilizador AISTV-PREMIUM existe" -ForegroundColor Green
              Write-Host "│ 📊 Estado: $($user.Enabled)" -ForegroundColor White
          } else {
              Write-Host "│ ❌ O utilizador não existe" -ForegroundColor Red
              exit 1
          }
          
          # Verificar privilégios de Administrador
          $isAdmin = (Get-LocalGroupMember -Group "Administrators" | Where-Object {$_.Name -like "*AISTV-PREMIUM"}).Count -gt 0
          if ($isAdmin) {
              Write-Host "│ ✅ Possui privilégios de Administrador" -ForegroundColor Green
          } else {
              Write-Host "│ ❌ Não possui privilégios de Administrador" -ForegroundColor Red
          }
          
          # Verificar privilégios de Remote Desktop
          $isRDPUser = (Get-LocalGroupMember -Group "Remote Desktop Users" | Where-Object {$_.Name -like "*AISTV-PREMIUM"}).Count -gt 0
          if ($isRDPUser) {
              Write-Host "│ ✅ Possui permissões de Remote Desktop" -ForegroundColor Green
          } else {
              Write-Host "│ ❌ Não possui permissões de Remote Desktop" -ForegroundColor Red
          }
          
          # Verificar serviço RDP
          $termService = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if ($termService.Status -eq 'Running') {
              Write-Host "│ ✅ O serviço TermService está em execução" -ForegroundColor Green
          } else {
              Write-Host "│ ❌ O serviço TermService não está em execução" -ForegroundColor Red
          }
          
          Write-Host "🎯 Verificação concluída!" -ForegroundColor Green

      # TAILSCALE PREMIUM
      - name: 🌐 CONFIGURAR REDE PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "🌐 A CONFIGURAR LIGAÇÃO DE REDE" -ForegroundColor Yellow
          
          # Instalar Tailscale
          try {
              $msiPath = "$env:TEMP\tailscale-premium.msi"
              Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
              Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait Remove-Item $msiPath -Force -ErrorAction SilentlyContinue Write-Host "│ ✅ Tailscale instalado com sucesso" -ForegroundColor Green } catch { Write-Host "│ ❌ Erro ao instalar o Tailscale" -ForegroundColor Red }  # Aguardar arranque do serviço Start-Sleep -Seconds 10  # Ligar ao Tailscale try { & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=ai-stv-premium-$env:GITHUB_RUN_ID --accept-routes --accept-dns --reset Write-Host "│ ✅ Ligação ao Tailscale bem-sucedida" -ForegroundColor Green } catch { Write-Host "│ ❌ Erro na ligação ao Tailscale" -ForegroundColor Red }  # Obter IP com mecanismo de tentativas Write-Host "🔄 A obter endereço IP..." -NoNewline -ForegroundColor Blue $ip = $null for($i=0; $i -lt 20; $i++) { try { $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1 if ($ip -and $ip -match '^\d+\.\d+\.\d+\.\d+$') { echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV Write-Host "`r✅ Endereço IP: $ip" -ForegroundColor Green
                      break
                  }
              } catch {
                  # Ignorar erro e tentar novamente
              }
              Write-Host "`r🔄 A obter endereço IP... $(@('.', '..', '...')[$i % 3])" -NoNewline -ForegroundColor Blue
              Start-Sleep -Seconds 3
          }
          
          if (-not $ip -or $ip -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              Write-Host "`r⚠️  Não foi possível obter o IP, a utilizar o localhost" -ForegroundColor Yellow
              echo "TAILSCALE_IP=localhost" >> $env:GITHUB_ENV
          }

      # MOSTRAR INTERFACE GRÁFICA / INFORMAÇÃO
      - name: 🎉 INFORMAÇÃO DE LIGAÇÃO
        run: |
          $matKhau = Get-Content$env:TEMP\rdp_password.txt -ErrorAction SilentlyContinue
          if (-not $matKhau) {$matKhau = "Não foi possível ler a palavra-passe"
          }
          
          # Converter tempo do input para minutos
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
              "1h" { $totalMinutes = 60; $displayTime = "1 hora" }
              "3h" { $totalMinutes = 180; $display
